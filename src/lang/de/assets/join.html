<section class="hero">
  <canvas id="sky"></canvas>
  <div class="hero-content">
    <h1><img src="./src/img/kebabcrafttext.png" alt="KebabCraftMC"></h1>
    <h1>How to Join.</h1>
    <p>Follow these simple steps to start your adventure.</p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="./panorama.js"></script>

<section class="features">
  <div id="step-display" class="feature-card"></div>
</section>

<script>
(function () {
  const stepsde = [
    { icon: "🎮", title: "Step 1", text: "Launch Minecraft (1.21.11 or newer)" },
    { icon: "🌐", title: "Step 2", text: "Go to Multiplayer > Add Server" },
    { icon: "📝", title: "Step 3", text: "Enter IP: play.kebabcraft.net" },
    { icon: "🚀", title: "Step 4", text: "Click Join and start playing!" }
  ];

  let indexde = 0;

  function initSteps() {
    const containerde = document.getElementById("step-display");

    if (!containerde) return; 

    function updateStepde() {
      const stepde = stepsde[indexde];
      indexde = (indexde + 1) % stepsde.length;

      const incomingde = document.createElement("div");
      incomingde.className = "feature-card slide-in";
      incomingde.innerHTML = `
        <h3>${stepde.icon} ${stepde.title}</h3>
        <p>${stepde.text}</p>
      `;

      const oldde = containerde.querySelector(".feature-card");

      if (oldde) {
        oldde.classList.remove("slide-in");
        oldde.classList.add("slide-out");

        oldde.addEventListener("animationend", () => {
          if (oldde.parentNode === containerde) {
            containerde.removeChild(oldde);
          }
        }, { once: true });
      }

      containerde.appendChild(incomingde);
    }

    updateStepde();
    setInterval(updateStepde, 3000);
  }


  initSteps();
  setTimeout(initSteps, 100);
})();
</script>

<p>Version: 1.21.11+</p>
